<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fantasy Realms Calculator</title>
    <!-- Cache busting: v=9 -->
    <link rel="stylesheet" href="style.css?v=9">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
    <link rel="apple-touch-icon" sizes="192x192" href="assets/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2d1b69">
</head>
<body>

<!-- Navigation -->
<nav class="top-nav">
    <div class="nav-left">
        <button class="nav-btn" onclick="openSettings()">&#9776;</button>
        <span class="nav-title">Fantasy Realms</span>
    </div>
    <div class="nav-right">
        <a class="bb-link" href="https://boardbuddy.games">🎲 BoardBuddy</a>
        <span class="current-player-name" id="currentPlayerName">Player 1</span>
    </div>
</nav>

<!-- Settings Panel -->
<div class="settings-overlay" id="settingsOverlay" onclick="closeSettings()"></div>
<div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
        <button class="settings-close" onclick="closeSettings()">&#215;</button>
    </div>

    <div class="settings-group">
        <div class="settings-group-title" data-i18n="players">Players</div>
        <div class="settings-players" id="settingsPlayerList"></div>
        <button class="settings-add-player" id="settingsAddPlayer" onclick="addPlayer()">
            <span class="settings-add-plus">+</span>
            <span data-i18n="addPlayer">Add Player</span>
        </button>
    </div>

    <div class="settings-group">
        <div class="settings-group-title" data-i18n="leaderboard">Leaderboard</div>
        <div id="leaderboardList"></div>
    </div>

    <div class="settings-group">
        <div class="settings-group-title" data-i18n="language">Language</div>
        <div class="settings-lang-row">
            <button class="lang-btn active" id="langEn" onclick="setLanguage('en')">🇬🇧 English</button>
        </div>
    </div>

    <div class="settings-group" style="margin-top: 24px;">
        <button class="settings-new-game" onclick="newGame()" data-i18n="newGame">New Game</button>
    </div>

    <div class="settings-version">v0.6</div>
</div>

<!-- Scrollable content -->
<div class="scroll-content" id="scrollContent">

    <!-- Card sections rendered by JS -->
    <div id="cardSections"></div>

    <!-- Summary -->
    <div class="summary" id="summary">
        <div class="summary-card">
            <details class="summary-details" id="summaryDetails">
                <summary class="summary-row total-row" id="summaryToggle">
                    <span class="summary-label" data-i18n="total">Total</span>
                    <span class="summary-value" id="totalPoints">0</span>
                </summary>
                <div id="suitBreakdown"></div>
                <div id="changeSuitInfo" class="change-suit-info"></div>
            </details>
        </div>
    </div>

    <div style="height: 40px;"></div>
</div>

<script src="cards.js?v=9"></script>
<script src="app.js?v=9"></script>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>

</body>
</html>
